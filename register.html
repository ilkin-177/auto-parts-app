<!DOCTYPE html>
<html lang="az" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat - AutoParts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#f59e0b', // Amber-500
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVBAR -->
    <header class="bg-slate-900 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <span class="text-amber-500 font-black text-2xl tracking-wider">AUTO</span>
                <span class="font-bold text-xl text-white">PARTS</span>
            </a>
            <a href="index.html" class="text-slate-400 hover:text-amber-500 text-sm transition flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Kataloqa qayıt
            </a>
        </div>
    </header>

    <!-- FORM SECTION -->
    <main class="flex-1 flex items-center justify-center p-4 my-8">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 w-full max-w-md shadow-2xl">
            
            <!-- Başlıq -->
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-amber-500/10 border border-amber-500/20 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="user-plus" class="w-6 h-6 text-amber-500"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">Alıcı Qeydiyyatı</h1>
                <p class="text-slate-400 text-xs mt-1">Ehtiyat hissələri sifariş etmək üçün yeni hesab yaradın</p>
            </div>

            <!-- Qeydiyyat Formu -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
                
                <!-- Ad və Soyad -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Ad</label>
                        <div class="relative">
                            <input type="text" required placeholder="Əli" class="w-full bg-slate-800 border border-slate-700 text-sm text-slate-100 pl-9 pr-3 py-2.5 rounded-xl outline-none focus:border-amber-500 transition">
                            <i data-lucide="user" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Soyad</label>
                        <input type="text" required placeholder="Məmmədov" class="w-full bg-slate-800 border border-slate-700 text-sm text-slate-100 px-3 py-2.5 rounded-xl outline-none focus:border-amber-500 transition">
                    </div>
                </div>

                <!-- E-poçt -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">E-poçt ünvanı</label>
                    <div class="relative">
                        <input type="email" required placeholder="nümayəndə@mail.com" class="w-full bg-slate-800 border border-slate-700 text-sm text-slate-100 pl-9 pr-3 py-2.5 rounded-xl outline-none focus:border-amber-500 transition">
                        <i data-lucide="mail" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                    </div>
                </div>

                <!-- Telefon -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Telefon nömrəsi</label>
                    <div class="relative">
                        <input type="tel" required placeholder="+994 50 123 45 67" class="w-full bg-slate-800 border border-slate-700 text-sm text-slate-100 pl-9 pr-3 py-2.5 rounded-xl outline-none focus:border-amber-500 transition">
                        <i data-lucide="phone" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                    </div>
                </div>

                <!-- Şifrə -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Şifrə</label>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 text-sm text-slate-100 pl-9 pr-3 py-2.5 rounded-xl outline-none focus:border-amber-500 transition">
                        <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                    </div>
                </div>

                <!-- Şifrə Təkrarı -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Şifrənin təkrarı</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 text-sm text-slate-100 pl-9 pr-3 py-2.5 rounded-xl outline-none focus:border-amber-500 transition">
                        <i data-lucide="shield-check" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                    </div>
                </div>

                <!-- Qaydalar razılığı -->
                <div class="flex items-start gap-2 pt-1">
                    <input type="checkbox" id="terms" required class="accent-amber-500 w-4 h-4 mt-0.5 rounded cursor-pointer">
                    <label for="terms" class="text-xs text-slate-400 cursor-pointer">
                        <a href="#" class="text-amber-500 hover:underline">İstifadəçi şərtləri</a> və <a href="#" class="text-amber-500 hover:underline">Məxfilik siyasəti</a> ilə razıyam.
                    </label>
                </div>

                <!-- Qeydiyyat düyməsi -->
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2 cursor-pointer mt-2">
                    <i data-lucide="user-check" class="w-4 h-4"></i>
                    <span>Qeydiyyatı Tamamla</span>
                </button>
            </form>

            <!-- Giriş keçidi -->
            <div class="mt-6 text-center border-t border-slate-800 pt-4">
                <p class="text-xs text-slate-400">
                    Artıq hesabınız var? 
                    <a href="login.html" class="text-amber-500 hover:underline font-semibold ml-1">Daxil olun</a>
                </p>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        <p>© 2026 AutoParts Marketplace. Bütün hüquqlar qorunur.</p>
    </footer>

    <!-- SCRIPT -->
    <script>
        lucide.createIcons();

        function handleRegister(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (pass !== confirmPass) {
                alert('Daxil edilən şifrələr üst-üstə düşmür!');
                return;
            }

            alert('Qeydiyyat uğurla tamamlandı! İndi kataloqa yönləndirilirsiniz.');
            window.location.href = 'catalog.html';
        }
    </script>
</body>
</html>
